<style>
/* Layout: one thumb-driven dark phone screen with a section color per tab, matching callscoaching.com */
:root{--bg:#0a0e14;--panel:#161d27;--panel2:#11171f;--line:#3a4553;--fg:#fff;--soft:#e8edf2;--dim:#d5dde5;--blue:#1f4fd0;--cyan:#33ddf5;--green:#6ee7a0;--amber:#ffc857;--violet:#c4b0ff;--c:var(--cyan);--d:'Anton',Impact,'Arial Narrow',sans-serif;--b:'Barlow',system-ui,sans-serif;--l:'Barlow Semi Condensed','Arial Narrow',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--b);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--c);text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:#0a0e14;border:1px solid #8a97a4;border-radius:6px;width:100%;min-height:48px;padding:0 12px}
textarea{padding:10px 12px;resize:vertical}
input::placeholder,textarea::placeholder{color:#8a97a4}
label.f{display:block;font-weight:600;font-size:15px}label.f>input,label.f>select,label.f>textarea{display:block;margin-top:5px;font-weight:400}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
.in{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.stack{display:grid;gap:12px}
.sec{padding-block:16px}
.an{font-family:var(--d);font-weight:400;text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:1.05;text-wrap:balance}
.lb{font:700 13px var(--l);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
.glow{color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 70%,transparent)}
.mut{color:var(--dim);font-size:14px}.p{margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:6px 14px;border-radius:4px;font:700 14px var(--l);text-transform:uppercase;letter-spacing:.1em;text-align:center;color:var(--fg);border:1.5px solid var(--fg)}
.btn.pri{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 0 22px -6px #3b6fe0}
.btn.acc{color:var(--c);border-color:var(--c)}.btn.sm{min-height:44px;width:auto;font-size:12px;padding:4px 12px;flex:0 0 auto}
.btn.on{background:var(--c);border-color:var(--c);color:#0a0e14}
.btn:disabled{opacity:.6}
.row{display:flex;align-items:center;gap:10px;min-width:0}.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item{display:flex;width:100%;align-items:center;gap:12px;min-height:60px;padding:8px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.line{display:flex;align-items:center;gap:10px;min-height:58px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chip{flex:1 0 auto;min-width:44px;min-height:46px;padding:4px 10px;border-radius:6px;font-weight:700;background:var(--panel);border:1.5px solid var(--line)}
.chip.on{color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.box{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;border-radius:4px;border:1.5px solid #8a97a4;color:#0a0e14;font-weight:800}
.box.on{background:var(--c);border-color:var(--c)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c)}
.head{padding-block:14px;background:var(--panel2);border-bottom:2px solid var(--c)}
.hero{padding-block:20px;background:radial-gradient(420px 260px at 85% 0%,rgba(47,98,230,.42),transparent 70%),var(--bg);border-bottom:1px solid var(--line)}
nav.tabs{display:grid;gap:4px;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:var(--panel);border-top:1px solid var(--line)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--t)}
nav.tabs button.on{background:color-mix(in srgb,var(--t) 13%,transparent);box-shadow:inset 0 0 0 1.5px var(--t)}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.setrow{display:grid;grid-template-columns:28px minmax(0,1fr) 64px 58px 44px;gap:6px;align-items:center;min-height:50px}
.setrow input{text-align:center;padding:0 2px;background:#1a222c;border-color:#55616f;font-weight:600;min-height:42px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.cal>div{height:42px;line-height:38px;border-radius:6px;font-weight:700;border:2px solid transparent;color:#8a97a4}
.cal .done{background:var(--c);color:#0a0e14}.cal .today{background:#fff;color:#0a0e14}.cal .up{border-color:var(--c);color:#fff}
.err{color:var(--amber);font-weight:600;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#fff;color:#0a0e14;padding:10px 16px;border-radius:6px;font-weight:600;z-index:20;max-width:90%;text-align:center}
.demo{display:flex;gap:6px;align-items:center;padding-block:6px;background:#1f4fd0;font-size:13px;font-weight:600;overflow-x:auto}.demo button{flex:0 0 auto;min-height:36px;padding:0 9px;border-radius:4px;border:1px solid #fff;color:#fff;font-size:12.5px;font-weight:700}.demo button.on{background:#fff;color:#1f4fd0}
.sample{margin:0;font-size:13px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head><body><div id="app"></div>

let me=null,D=null,cfg={phone:'9013590305',waiver:''},U={tab:'home',view:'signin'},toastT=0;

async function api(method,path,body){
  if(DEMO)return demoApi(method,path,body);
  const opt={method,headers:{}};
  if(body instanceof FormData)opt.body=body;
  else if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}
  const pr=fetch(path,opt);
  if(method!=='GET')writes=writes.then(()=>pr).catch(()=>{});
  const r=await pr;
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&me&&!path.includes('login')){me=null;D=null;U.view='signin';draw(false)}
  if(!r.ok)throw new Error(j.detail||'Something went wrong. Try again.');
  return j;
}

const programCard=(p,cta,cur)=>`<div class="card" style="border-color:${cur?'#c4b0ff':'var(--line)'}"><div class="row" style="justify-content:space-between"><span class="lb" style="font-size:15px;color:#fff">${p.name}</span><span class="lb" style="font-size:12px;color:#c4b0ff">${cur?'Your program':p.tag}</span></div><div class="row" style="align-items:baseline;gap:5px;margin-top:2px"><span class="an" style="font-size:38px">${p.price}</span><span>${p.per}</span><span class="lb" style="margin-left:auto;padding:3px 9px;color:#33ddf5;border:1.5px solid #33ddf5;border-radius:3px;text-shadow:0 0 10px rgba(51,221,245,.7)">${p.len}</span></div><div style="font-weight:600">${p.s}</div>${p.scan?'<div style="margin-top:2px;font-weight:700;color:#33ddf5">Includes secaTRU 360 body scan</div>':''}<div class="mut" style="margin-top:2px">${p.m}</div>${cta?`<a class="btn sm" style="width:100%;margin-top:10px" href="${smsHref(cfg.phone,'Hey Nick, I have a question about '+p.name+'.')}">${cta}</a>`:''}</div>`;

function aSched(){

  return `<main><section class="in sec stack"><div class="row"><button class="btn sm" aria-label="Previous week" data-a="sWeek" data-v="-7">‹</button><div class="chips grow" style="--c:#33ddf5">${days.map(d=>{const x=parse(d);return `<button class="chip ${d===cur?'on':''}" style="padding:2px 4px;min-width:40px;flex:1" aria-pressed="${d===cur}" data-a="sDay" data-v="${d}"><span style="display:block;font-size:12px;font-weight:600">${x.toLocaleDateString('en-US',{weekday:'narrow'})}</span>${x.getDate()}</button>`}).join('')}</div><button class="btn sm" aria-label="Next week" data-a="sWeek" data-v="7">›</button></div>

}

  <button class="btn acc" style="--c:#33ddf5" data-a="fdAdd">+ Add meal</button><button class="btn" data-a="fdCopy">Copy day ${i+1} to all 7 days</button><button class="btn pri" data-a="fdSave">Save nutrition</button></section></main>`}
function aFiles(){const list=D.files.filter(f=>f.client_id===U.cid);return `<main><section class="in sec stack">${back()}<h1 class="an" style="font-size:30px">Workout files</h1><p class="p">Clients open these from their Train tab.</p><label class="btn pri" style="position:relative;cursor:pointer">Upload a file<input id="up" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,image/*" data-upload="1" style="position:absolute;inset:0;opacity:0;min-height:0;cursor:pointer"></label>${err()}${list.length?list.map(f=>`<div class="item"><span class="grow"><b style="display:block;font-weight:600">${esc(f.name)}</b><span class="mut">Added ${nice(f.created)}</span></span><button class="btn sm" data-a="fDel" data-v="${f.id}">Remove</button></div>`).join(''):'<p class="p mut">No files yet.</p>'}<p class="mut" style="margin:0">PDFs, Word files, spreadsheets and photos up to 15 MB. Clients can only log sets on workouts in the plan builder.</p></section></main>`}
function aHealth(){const c=cBy(U.cid),h=c.health;const L={doctor:'Told by a doctor to limit exercise',symptoms:'Chest pain, dizziness or faintness with activity',injury:'Injury or condition to know about',scan:'Implant, sensor or device, arrhythmia, or pregnancy (check before body scan)'};return `<main><section class="in sec stack">${back()}<h1 class="an" style="font-size:30px">Health form</h1>${h?`${Object.entries(h).map(([k,v])=>`<div class="line"><span class="grow">${L[k]||esc(k)}</span><b style="color:${v==='yes'?'#ffc857':'#fff'}">${v==='yes'?'Yes':'No'}</b></div>`).join('')}<p class="mut">Agreement accepted ${c.agreed_at?nice(c.agreed_at.slice(0,10)):''}</p>${c.agreed_text?`<div class="card" style="max-height:260px;overflow:auto;white-space:pre-wrap;font-size:14px">${esc(c.agreed_text)}</div>`:''}`:'<p class="p">They\'ll complete this when they create their account.</p>'}</section></main>`}
function aNotes(){const c=cBy(U.cid);return `<main><form class="in sec stack" data-f="notes">${back()}<h1 class="an" style="font-size:30px">Private notes</h1><label class="f">Only you can see these<textarea id="nt" rows="10">${esc(c.notes||'')}</textarea></label><button class="btn pri">Save notes</button></form></main>`}
function aInvite(){const c=cBy(U.cid),first=(c.name||'').split(' ')[0];const site=DEMO?'[your app link]':location.origin;const msg=`${first?first+", it's Nick.":"It's Nick."} ${c.has_account?'Here is your new login code':'Your client folder is ready. Create your account'} at ${site} with this number and code ${c.code||'------'}.`;
  return `<main><section class="in sec stack">${back()}<div class="lb" style="color:#33ddf5">${c.has_account?'New login code':'Folder ready'}</div><h1 class="an" style="font-size:34px">Text the sign-up code</h1><p class="p">Build the folder before or after you send this. Everything will be there when they sign up.</p><div style="padding:14px;background:var(--blue);border-radius:16px 16px 4px 16px;overflow-wrap:anywhere" id="msg">${esc(msg)}</div><a class="btn" href="${smsHref(c.phone,msg)}">Open in Messages</a><button class="btn acc" style="--c:#33ddf5" data-a="newCode">Make a new code</button><button style="min-height:44px;font-weight:600;color:#33ddf5" data-a="toFolder">Done</button></section></main>`}
function aAdd(){return `<main><form class="in sec stack" data-f="add"><h1 class="an" style="font-size:34px">New client</h1><div class="grid2" style="--c:#33ddf5">${[['inperson','In person'],['online','Online']].map(([k,t])=>`<button type="button" class="chip ${(U.aFmt||'inperson')===k?'on':''}" aria-pressed="${(U.aFmt||'inperson')===k}" data-a="aFmt" data-v="${k}">${t}</button>`).join('')}</div><label class="f">Name<input id="an" placeholder="Client's full name"></label><label class="f">Phone number<input id="ap" type="tel" placeholder="(901) 000-0000"></label><p class="mut" style="margin:0">Add either one now. The number is what connects their account.</p><label class="f">Primary goal<input id="ag" placeholder="Build muscle"></label><label class="f">Program<input id="ar" placeholder="Monthly · 4x a week · 60 min"></label><div class="grid2"><label class="f">What they pay ($)<input id="aa" inputmode="decimal" placeholder="300"></label><label class="f">Due<input id="ad" placeholder="Tue Dec 1"></label></div>${err()}<button class="btn pri">Create folder</button></form></main>`}
function aMoney(){const num=v=>parseFloat(v)||0,due=D.clients.filter(c=>c.amount&&!c.current_paid).reduce((a,c)=>a+num(c.amount),0),mo=today().slice(0,7),got=D.clients.flatMap(c=>c.payments||[]).filter(p=>p.date.slice(0,7)===mo).reduce((a,p)=>a+num(p.amount),0);
  return `<main><section class="in sec stack"><div class="grid2"><div class="card"><div class="lb">Still due</div><div class="an glow" style="font-size:32px;--c:#33ddf5">$${due.toLocaleString()}</div></div><div class="card"><div class="lb">Paid this month</div><div class="an" style="font-size:32px">$${got.toLocaleString()}</div></div></div><div class="lb">Set amounts and due dates</div>
  ${D.clients.map(c=>`<div class="card stack" style="gap:8px"><div class="row" style="justify-content:space-between"><b style="font-weight:600">${esc(c.name||fmtPhone(c.phone))}</b><span style="font-size:14px;font-weight:600;color:${c.current_paid?'var(--dim)':'#33ddf5'}">${c.current_paid?'Paid':c.amount?'Due':'Not set'}</span></div><div style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px"><label class="f" style="font-size:13px">Amount ($)<input inputmode="decimal" data-m="${c.id}" data-k="amount" value="${esc(c.amount||'')}"></label><label class="f" style="font-size:13px">Due<input data-m="${c.id}" data-k="due" value="${esc(c.due||'')}" placeholder="Tue Dec 1"></label></div><label class="f" style="font-size:13px">For<input data-m="${c.id}" data-k="due_label" value="${esc(c.due_label||'')}" placeholder="December coaching"></label>${c.current_paid?`<div class="row"><button class="btn sm" style="flex:1" data-a="unpaid" data-v="${c.id}">Undo paid</button><button class="btn sm pri" style="flex:1" data-a="nextDue" data-v="${c.id}">Start next reminder</button></div>`:`<button class="btn sm" style="width:100%" data-a="paid" data-v="${c.id}">Mark paid</button>`}</div>`).join('')||'<p class="p mut">Add a client to set up payments.</p>'}
  <p class="mut" style="margin:0">Clients see this as a reminder on their Pay tab. The app doesn't move or check money.</p><button class="btn" data-a="screen0" data-v="settings">Payment usernames and settings</button><button class="mut" style="min-height:44px;text-align:left" data-a="logout">Sign out</button></section></main>`}
function aSettings(){const s=cfg;const f=[['venmo','Venmo username','NickCall2003'],['cashapp','Cash App $cashtag','determlned'],['apple','Apple Cash phone number','(901) 359-0305'],['phone','Your text number','(901) 359-0305'],['location','Where you train','Crunch Fitness Cordova']];
  return `<main><form class="in sec stack" data-f="settings"><button type="button" class="lb" style="min-height:44px;text-align:left" data-a="tab" data-v="money">‹ Money</button><h1 class="an" style="font-size:30px">Settings</h1>${f.map(([k,l,p])=>`<label class="f">${l}<input data-s="${k}" value="${esc(s[k]||'')}" placeholder="${p}"></label>`).join('')}<label class="f">Training agreement and release<textarea data-s="waiver" rows="10">${esc(s.waiver||'')}</textarea></label>${err()}<button class="btn pri">Save settings</button></form></main>`}

/* ---------- actions ---------- */
const blankDay=()=>({name:'',exercises:[],condition:[],move:[]});
const tpl=()=>[['A','3 × 10'],['A','3 × 12'],['B','3 × 10'],['B','3 × 15'],['C','3 × 12'],['C','3 × 45 sec']].map(([group,scheme])=>({group,name:'',scheme,cue:'',demo:'',sets:3}));
const clone=o=>JSON.parse(JSON.stringify(o));
async function refresh(keep=true){await load();draw(keep)}
async function run(fn){try{U.err='';await fn()}catch(e){U.err=e.message;draw(true);if(!document.querySelector('[role=alert]'))toast(e.message)}}
const A={
 tab:(e)=>{Object.assign(U,{tab:e.dataset.v,screen:null,cid:null,rid:null,err:'',part:'lift',delAsk:false});draw(false);quietRefresh()},
 view:(e)=>go({view:e.dataset.v,err:''}),
 screen:(e)=>{const v=e.dataset.v;const c=cBy(U.cid);if(v==='plan'){U.pl=clone(c.plan?.days||[]);U.plDay=0}if(v==='food'){const dd=clone(c.nutrition?.days||[]);U.fd=Array.from({length:7},(_,i)=>dd[i]||{meals:[]});U.fdDay=0}go({screen:v,err:''})},
 screen0:(e)=>go({screen:e.dataset.v,cid:null,err:''}),
 toFolder:()=>go({screen:'folder',err:'',delAsk:false}),
 openClient:(e)=>go({cid:+e.dataset.v,screen:'folder',tab:'people',err:'',delAsk:false}),
 addClient:()=>go({screen:'add',cid:null,err:''}),
 aFmt:(e)=>{U.aFmt=e.dataset.v;keepAdd();draw(true);restoreAdd()},
 ans:(e)=>{U.ans={...(U.ans||{}),[e.dataset.k]:e.dataset.v};U.err='';draw(true)},
 agree:()=>{U.agree=!U.agree;U.err='';draw(true)},
 finish:()=>run(async()=>{const r=await api('POST','/api/join/complete',{phone:U.jPhone,code:U.jCode,password:U.jPw,health:U.ans,agreed:U.agree});me=r.role;U.tab='home';await refresh(false)}),
 logout:()=>run(async()=>{await api('POST','/api/logout');me=null;D=null;Object.assign(U,{view:'signin',tab:'home',screen:null,cid:null});draw(false)}),
 openEx:(e)=>{const v=+e.dataset.v;U.open=U.open===v?-1:v;draw(true)},
 setDone:(e)=>run(async()=>{const k=e.dataset.k,log=C().workouts=C().workouts||{},cur=log[k]||{},row=e.closest('.setrow');const inputs=row.querySelectorAll('input');const v={...cur,w:inputs[0].value||inputs[0].placeholder,r:inputs[1].value||inputs[1].placeholder,done:!cur.done};log[k]=v;
   const p=k.split('|'),ei=+e.dataset.ei,n=+e.dataset.n;let all=true;for(let s=0;s<n;s++)if(!log[`${p[0]}|${p[1]}|${ei}|${s}`]?.done)all=false;if(all&&v.done&&planDays()[p[1]].exercises[ei+1])U.open=ei+1;draw(true);await api('POST','/api/client/log',{type:'workout',key:k,value:v})}),
 pickDay:(e)=>go({day:+e.dataset.v,open:0,part:'lift'}),
 part:(e)=>{U.part=e.dataset.v;draw(false)},
 extra:(e)=>run(async()=>{const k=e.dataset.k,s=C().extras=C().extras||{},v=!s[k];if(v)s[k]=true;else delete s[k];draw(true);await api('POST','/api/client/log',{type:'extra',key:k,value:v})}),
 finishW:()=>{U.finished=today()+dayIdx();draw(true);toast('Workout logged.')},
 pickFuel:(e)=>{U.fuel=+e.dataset.v;draw(true)},
 meal:(e)=>run(async()=>{const k=e.dataset.k,s=C().meals=C().meals||{},v=!s[k];if(v)s[k]=true;else delete s[k];draw(true);await api('POST','/api/client/log',{type:'meal',key:k,value:v})}),
 ci:(e)=>{U.ciw=val('ciw');U.cig=val('cig');U.cih=val('cih');U.ci={...(U.ci||{}),[e.dataset.k]:e.dataset.v};U.err='';draw(true)},
 progs:()=>{U.progs=!U.progs;draw(true)},
 demoFile:()=>toast('In the real app this opens the file.'),
 sDone:(e)=>run(async()=>{const s=D.sessions.find(x=>x.id===+e.dataset.v);await api('PATCH','/api/admin/sessions/'+s.id,{done:!s.done});await refresh()}),
 paid:(e)=>run(async()=>{await api('POST',`/api/admin/clients/${e.dataset.v}/paid`);await refresh();toast('Marked paid.')}),
 unpaid:(e)=>run(async()=>{await api('POST',`/api/admin/clients/${e.dataset.v}/unpaid`);await refresh()}),
 nextDue:(e)=>run(async()=>{await api('PUT','/api/admin/clients/'+e.dataset.v,{current_paid:false});await refresh();toast('Reminder is live. Update the amount, due date and label.')}),
 sDay:(e)=>go({sDay:e.dataset.v,err:''}),
 sWeek:(e)=>{const d=parse(U.sDay||today());d.setDate(d.getDate()+ +e.dataset.v);go({sDay:iso(d),err:''})},
 sAdd:()=>{if(!D.clients.some(c=>c.format!=='online'))return toast('Add an in-person client first.');go({sAdd:true,err:'',undo:null})},
 sCancel:()=>go({sAdd:false,err:''}),
 sLen:(e)=>{const k=[val('sc'),val('st'),val('sn')];U.sLen=+e.dataset.v;draw(true);setF(k)},
 sRep:()=>{const k=[val('sc'),val('st'),val('sn')];U.sRep=!U.sRep;draw(true);setF(k)},
 sDel:(e)=>run(async()=>{const s=D.sessions.find(x=>x.id===+e.dataset.v);await api('DELETE','/api/admin/sessions/'+s.id);U.undo=s;await refresh()}),
 sUndo:()=>run(async()=>{const s=U.undo;await api('POST','/api/admin/sessions',{client_id:s.client_id,date:s.date,minutes:s.minutes,length:s.length,title:s.title});U.undo=null;await refresh()}),
 rOpen:(e)=>go({rid:+e.dataset.v,err:''}),
 rBack:()=>go({rid:null,err:''}),
 openPlan:(e)=>{U.cid=+e.dataset.v;U.tab='people';const c=cBy(U.cid);U.pl=clone(c.plan?.days||[]);U.plDay=0;go({screen:'plan',rid:null,err:''})},
 delAsk:()=>go({delAsk:true}),delNo:()=>go({delAsk:false}),
 delYes:()=>run(async()=>{await api('DELETE','/api/admin/clients/'+U.cid);Object.assign(U,{cid:null,screen:null,tab:'people',delAsk:false});await refresh(false)}),
 newCode:()=>run(async()=>{await api('POST',`/api/admin/clients/${U.cid}/code`);await refresh()}),
 plDay:(e)=>go({plDay:+e.dataset.v}),
 plAddDay:()=>{U.pl.push(blankDay());go({plDay:U.pl.length-1})},
 plDelDay:()=>{U.pl.splice(U.plDay||0,1);go({plDay:0})},
 plTpl:()=>{const d=U.pl[U.plDay||0];d.exercises=d.exercises.concat(tpl());draw(true)},
 plAddEx:()=>{U.pl[U.plDay||0].exercises.push({group:'',name:'',scheme:'',cue:'',demo:'',sets:3});draw(true)},
 plDelEx:(e)=>{U.pl[U.plDay||0].exercises.splice(+e.dataset.v,1);draw(true)},
 plAddX:(e)=>{const d=U.pl[U.plDay||0];(d[e.dataset.k]=d[e.dataset.k]||[]).push({t:'',d:''});draw(true)},
 plDelX:(e)=>{U.pl[U.plDay||0][e.dataset.k].splice(+e.dataset.v,1);draw(true)},
 plSave:()=>run(async()=>{const days=U.pl.map((d,i)=>({...d,name:(d.name||'').trim()||'Workout '+(i+1),exercises:d.exercises.filter(x=>(x.name||'').trim()).map(x=>({...x,sets:+(String(x.scheme).match(/^\s*(\d+)/)||[])[1]||3}))}));await api('PUT','/api/admin/clients/'+U.cid,{plan:{days}});await load();U.pl=clone(days);draw(true);toast('Plan saved. Their Train tab is updated.')}),
 fdDay:(e)=>go({fdDay:+e.dataset.v}),
 fdAdd:()=>{U.fd[U.fdDay||0].meals.push({name:'',desc:'',p:'',c:'',f:''});draw(true)},
 fdDel:(e)=>{U.fd[U.fdDay||0].meals.splice(+e.dataset.v,1);draw(true)},
 fdCopy:()=>{const m=U.fd[U.fdDay||0].meals;U.fd=U.fd.map(()=>({meals:clone(m)}));toast('Copied to all 7 days. Tap Save to keep it.')},
 fdSave:()=>run(async()=>{await api('PUT','/api/admin/clients/'+U.cid,{nutrition:{days:U.fd}});await load();draw(true);toast('Nutrition saved.')}),
 fDel:(e)=>run(async()=>{await api('DELETE','/api/admin/files/'+e.dataset.v);await refresh()}),
 demo:(e)=>demoSwitch(e.dataset.v),
};
function setF([a,b,c]){const s=(i,v)=>{const e=document.getElementById(i);if(e)e.value=v};s('sc',a);s('st',b);s('sn',c)}
let addDraft={};function keepAdd(){addDraft={an:val('an'),ap:val('ap'),ag:val('ag'),ar:val('ar'),aa:val('aa'),ad:val('ad')}}function restoreAdd(){Object.entries(addDraft).forEach(([k,v])=>{const e=document.getElementById(k);if(e)e.value=v})}
const F={
 login:()=>run(async()=>{const r=await api('POST','/api/login',{phone:val('ph'),password:val('pw')});me=r.role;U.tab='home';await refresh(false)}),
 coach:()=>run(async()=>{const r=await api('POST','/api/admin/login',{password:val('pw')});me=r.role;U.tab='home';await refresh(false)}),
 join:()=>run(async()=>{const phone=val('ph'),code=val('code');U.jPhone=phone;U.jCode=code;const r=await api('POST','/api/join/check',{phone,code});U.first=r.first_name;U.needsHealth=r.needs_health;go({view:'join2',err:''})}),
 join2:()=>run(async()=>{const pw=val('pw');if(pw.length<10)throw new Error('Use at least 10 characters for your password.');U.jPw=pw;if(U.needsHealth)go({view:'health',err:''});else A.finish()}),
 weight:()=>run(async()=>{const w=val('wt');if(!(parseFloat(w)>0))throw new Error('Enter your weight as a number.');await api('POST','/api/client/log',{type:'weight',key:today(),value:parseFloat(w)});await refresh();toast('Weight logged.')}),
 checkin:()=>run(async()=>{const A0=U.ci||{};U.ciw=val('ciw');U.cig=val('cig');U.cih=val('cih');if(!U.ciw.trim()||['plan','train','sleep','energy','hunger'].some(k=>!A0[k]))throw new Error('Add your weight and answer each scale.');await api('POST','/api/client/checkin',{weight:U.ciw,...A0,good:U.cig,hard:U.cih});U.ci={};U.ciw=U.cig=U.cih='';await refresh(false);toast('Sent to Nick.')}),
 session:()=>run(async()=>{await api('POST','/api/admin/sessions',{client_id:+val('sc'),date:U.sDay||today(),minutes:+val('st'),length:U.sLen||60,title:val('sn').trim()||'Session',repeat:!!U.sRep});U.sAdd=false;U.sRep=false;await refresh();toast('Session added.')}),
 reply:()=>run(async()=>{await api('POST',`/api/admin/checkins/${U.rid}/reply`,{reply:val('rp')});U.rid=null;await refresh(false);toast('Reply sent.')}),
 details:()=>run(async()=>{await api('PUT','/api/admin/clients/'+U.cid,{name:val('dn'),phone:val('dp'),format:val('df'),program:val('dg0'),goal:val('dg'),why:val('dw'),start_w:val('ds'),goal_w:val('dt'),note:val('dnote')});await load();go({screen:'folder',err:''});toast('Saved.')}),
 notes:()=>run(async()=>{await api('PUT','/api/admin/clients/'+U.cid,{notes:val('nt')});await load();go({screen:'folder'});toast('Notes saved.')}),
 add:()=>run(async()=>{const r=await api('POST','/api/admin/clients',{name:val('an'),phone:val('ap'),format:U.aFmt||'inperson',goal:val('ag'),program:val('ar'),amount:val('aa'),due:val('ad'),current_paid:false});await load();addDraft={};U.cid=r.id;const c=cBy(r.id);go({screen:c.phone?'invite':'folder',tab:'people',err:''})}),
 settings:()=>run(async()=>{const b={};document.querySelectorAll('[data-s]').forEach(e=>b[e.dataset.s]=e.value);await api('PUT','/api/admin/settings',b);await load();draw(true);toast('Settings saved.')}),
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)quietRefresh()});
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-a]');if(!e)return;const fn=A[e.dataset.a];if(fn){ev.preventDefault();fn(e)}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=F[ev.target.dataset.f];if(f)f()});
document.addEventListener('change',ev=>{const e=ev.target;
 if(e.dataset.log){const k=e.dataset.log,log=C().workouts=C().workouts||{},v={...(log[k]||{}),[e.dataset.fld]:e.value};log[k]=v;run(()=>api('POST','/api/client/log',{type:'workout',key:k,value:v}))}
 if(e.dataset.m){const id=+e.dataset.m,k=e.dataset.k;run(async()=>{await api('PUT','/api/admin/clients/'+id,{[k]:e.value});const c=cBy(id);c[k]=e.value;const m=document.activeElement;if(k==='amount'&&(!m||!m.dataset?.m))draw(true)})}
 if(e.dataset.upload)run(async()=>{for(const file of e.files){const fd=new FormData();fd.append('file',file);await api('POST',`/api/admin/clients/${U.cid}/files`,fd)}await refresh();toast('Uploaded.')});
});
document.addEventListener('input',ev=>{const e=ev.target;
 if(e.dataset.pl){const d=U.pl[U.plDay||0],p=e.dataset.pl.split('.');if(p[0]==='d')d[p[1]]=e.value;else if(p[0]==='e')d.exercises[+p[1]][p[2]]=e.value;else d[p[0]][+p[1]][p[2]]=e.value}
 if(e.dataset.fd){const[n,k]=e.dataset.fd.split('.');U.fd[U.fdDay||0].meals[+n][k]=e.value}
});

(async function start(){
 if(DEMO){demoInit();return}
 try{const r=await api('GET','/api/me');me=r.role;if(r.settings)cfg={...cfg,...r.settings};if(me)await load()}catch(e){}
 draw(false);
})();
</script>
